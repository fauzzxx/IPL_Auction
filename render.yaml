services:
  - type: web
    name: ipl-auction-arena
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./arena.db
      - key: HOST
        value: 0.0.0.0
      - key: CLIENT_ORIGINS
        sync: false
